
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audio Player</title>

    <style>
        body {
            background: #111;
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .player {
            background: #222;
            padding: 30px;
            border-radius: 15px;
            text-align: center;
            width: 300px;
        }

        audio {
            width: 100%;
            margin-top: 20px;
        }
    </style>
</head>

<body>

    <div class="player">
        <h2>Audio Player</h2>
        <p>Enjoy the audio</p>

        <audio controls autoplay loop>
            <source src="audio.mp3" type="audio/mpeg">
            Your browser does not support audio.
        </audio>
    </div>

</body>
</html>
